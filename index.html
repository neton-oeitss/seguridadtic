<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VulnLab — Laboratorio CTF · Curso TIC Ciberseguridad 30h</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0e1721; --bg2:#111c29; --panel:#161f2c; --panel2:#1b2736; --border:#253244;
    --text:#dfe6ee; --muted:#7c8b9e; --green:#9fef00; --green-d:#77ff00;
    --red:#ff3e3e; --blue:#41b6ff; --purple:#a78bfa; --orange:#ff9f2c; --yellow:#ffd803;
  }
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  code,pre,input.term{font-family:'Cascadia Code',Consolas,'Courier New',monospace}

  header{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:22px;position:sticky;top:0;z-index:50}
  .logo{font-size:22px;font-weight:800;color:var(--green);letter-spacing:1px}
  .logo span{color:var(--text)}
  nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
  nav button{background:none;border:none;color:var(--muted);font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
  nav button:hover{color:var(--text);background:var(--panel)}
  nav button.active{color:var(--green);background:var(--panel)}
  .userbox{display:flex;align-items:center;gap:14px;font-size:13px}
  .avatar{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--green),var(--blue));display:flex;align-items:center;justify-content:center;font-weight:800;color:#0e1721}
  .rankbar{width:150px}
  .rankbar .lbl{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-bottom:4px}
  .rankbar .track{height:6px;background:var(--border);border-radius:4px;overflow:hidden}
  .rankbar .fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));transition:width .5s}

  main{max-width:1180px;margin:0 auto;padding:28px 22px 80px}

  .filters{display:flex;gap:8px;margin:8px 0 20px;flex-wrap:wrap}
  .filters button{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer}
  .filters button.on{border-color:var(--green);color:var(--green)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.15s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--green);transform:translateY(-2px)}
  .card h3{font-size:17px;margin-bottom:4px}
  .card .os{font-size:12px;color:var(--muted);line-height:1.5}
  .modtag{display:inline-block;font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;background:#1c2a3d;color:var(--blue)}
  .tooldots{display:inline-flex;gap:5px;margin-left:8px}
  .tooldot{font-size:10px;padding:2px 7px;border-radius:8px;background:#221a10;color:var(--orange)}
  .diff{display:inline-block;font-size:11px;font-weight:700;padding:3px 12px;border-radius:12px;margin-top:10px}
  .d-easy{background:#12261c;color:var(--green)} .d-medium{background:#2b2310;color:var(--yellow)} .d-hard{background:#2a1214;color:var(--red)}
  .owned-badge{position:absolute;top:0;right:0;background:var(--green);color:#0e1721;font-size:10px;font-weight:800;padding:4px 12px;border-radius:0 0 0 10px}
  .cardmeta{display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--muted)}
  .pwned-dots{display:flex;gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
  .dot.user{background:var(--green)} .dot.root{background:var(--red)} .dot.sys{background:var(--blue)}

  .machine-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .machine-head h2{font-size:24px}
  .machine-head .ip{color:var(--green);font-size:14px;margin-top:4px}
  .btn{background:var(--green);color:#0e1721;font-weight:700;border:none;border-radius:8px;padding:9px 18px;cursor:pointer;font-size:13px;font-family:inherit}
  .btn:hover{filter:brightness(1.12)}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border)}

  .term-wrap{background:#060b12;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:16px}
  .term-bar{background:var(--panel2);padding:9px 14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .term-bar .tdot{width:10px;height:10px;border-radius:50%}
  #termout{padding:14px;height:420px;overflow-y:auto;font-size:13px;line-height:1.65}
  #termout .cmd{color:var(--green)} #termout .err{color:var(--red)} #termout .info{color:var(--blue)} #termout .ok{color:var(--green)} #termout .dim{color:var(--muted)} #termout .flag{color:var(--yellow);font-weight:700}
  .term-input-row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border)}
  .term-input-row .prompt{color:var(--green);font-size:13px;white-space:nowrap}
  input.term{flex:1;background:none;border:none;color:var(--text);font-size:13px;outline:none}

  .flagbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:20px}
  .flagbox h3{font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:14px}
  .flagrow{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap}
  .flagrow input{flex:1;min-width:220px;background:#060b12;border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:monospace;font-size:13px;outline:none}
  .flagrow input:focus{border-color:var(--green)}
  .flagstate{font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px}
  .st-ok{background:#12261c;color:var(--green)}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--panel2);border:1px solid var(--green);color:var(--green);padding:14px 20px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(10px);transition:.3s;z-index:99;max-width:380px}
  .toast.show{opacity:1;transform:none}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{color:var(--muted);text-transform:uppercase;font-size:10px;letter-spacing:1px;text-align:left;padding:10px;border-bottom:1px solid var(--border)}
  td{padding:10px;border-bottom:1px solid var(--border)}
  tr.me td{background:#15231a}
  .rankname{font-weight:800;color:var(--green)}
  .writeup{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-top:20px;font-size:13px;line-height:1.7}
  .writeup h3{color:var(--orange);font-size:14px;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
  .writeup code{background:#060b12;padding:2px 7px;border-radius:5px;color:var(--green)}
  .hidden{display:none}
  .hintpill{background:#1c2a3d;color:var(--blue);border:1px solid #2b4a6b;font-size:12px;padding:5px 12px;border-radius:14px;cursor:pointer}
  /* ----- modal alumno ----- */
  .modal-bg{position:fixed;inset:0;background:rgba(4,8,14,.8);display:flex;align-items:center;justify-content:center;z-index:200}
  .modal{background:var(--panel2);border:1px solid var(--green);border-radius:14px;padding:28px;width:min(420px,90vw);text-align:center}
  .modal h2{font-size:19px;margin-bottom:6px}
  .modal p{color:var(--muted);font-size:13px;margin-bottom:18px;line-height:1.6}
  .modal input{width:100%;background:#060b12;border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:15px;outline:none;margin-bottom:16px;text-align:center}
  .modal input:focus{border-color:var(--green)}
  .modal .err{color:var(--red);font-size:12px;margin:-10px 0 12px;display:none}
  @media(max-width:720px){ .rankbar{display:none} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>

<header>
  <div class="logo">Vuln<span>Lab</span> ⚡</div>
  <nav>
    <button id="nav-machines" class="active" onclick="view('machines')">Máquinas</button>
    <button id="nav-tools" onclick="view('tools')">Herramientas</button>
    <button id="nav-solutions" onclick="view('solutions')">📖 Soluciones</button>
    <button id="nav-ranking" onclick="view('ranking')">Ranking</button>
    <button id="nav-profile" onclick="view('profile')">Mi progreso</button>
    <button id="nav-help" onclick="view('help')">Guía</button>
  </nav>
  <div class="userbox">
    <div class="rankbar">
      <div class="lbl"><span id="rankName">Alumno nuevo</span><span id="xpTxt">0 XP</span></div>
      <div class="track"><div class="fill" id="xpBar" style="width:0%"></div></div>
    </div>
    <div class="avatar" id="avatar" title="Cambiar mi nombre" style="cursor:pointer" onclick="askName(true)">--</div>
  </div>
</header>

<main id="app"></main>
<div class="toast" id="toast"></div>
<div id="modal"></div>

<script>
/* =========================================================
   VulnLab — CTF estático estilo HTB · Curso TIC 30h
   16 máquinas, cada una centrada en una herramienta:
   nmap, hydra, john, hashcat, metasploit, nikto, gobuster,
   sqlmap, burp, suricata, wireshark, wazuh, responder,
   searchsploit, nc, docker. Todo en localStorage.
   Fines exclusivamente educativos.
========================================================= */

/* ---------- ESTADO ---------- */
const SAVE_KEY='vulnlab_tic30_v3';
let S=load();
function load(){
  try{ const d=JSON.parse(localStorage.getItem(SAVE_KEY)); if(d&&d.flags) return d; }catch(e){}
  return { flags:{}, xp:0, user:null, initials:'--' };
}
function save(){ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }
function initialsOf(name){
  return (name||'?').split(/\s+/).filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase()||'?';
}
function setName(name){
  name=(name||'').trim();
  if(!name) return false;
  S.user=name; S.initials=initialsOf(name); save();
  $('avatar').textContent=S.initials;
  if(currentView==='ranking') renderRanking();
  if(currentView==='profile') renderProfile();
  return true;
}
function askName(force){
  const forced=force===true;
  $('modal').innerHTML='<div class="modal-bg"><div class="modal">'
   +'<h2>🕵️ ¿Quién juega?</h2>'
   +'<p>Introduce tu nombre para aparecer en el <b style="color:var(--text)">ranking de la clase</b> con tus XP. '
   +'Se guarda solo en <b style="color:var(--text)">tu navegador</b> — nada sale de tu equipo.</p>'
   +'<input id="nameInput" maxlength="30" placeholder="Ej.: María Gómez" value="'+(S.user?esc(S.user):'')+'" autofocus>'
   +'<div class="err" id="nameErr">Escribe al menos 2 caracteres</div>'
   +'<button class="btn" onclick="confirmName()">Guardar y empezar ▶</button>'
   +(forced?'<div style="margin-top:12px"><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>':'')
   +'</div></div>';
  $('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') confirmName(); });
  $('nameInput').focus();
}
function confirmName(){
  const v=$('nameInput').value;
  if(setName(v)){ closeModal(); toast('👋 ¡Hola, <b>'+esc(S.user)+'</b>! Ya apareces en el ranking.'); }
  else $('nameErr').style.display='block';
}
function closeModal(){ $('modal').innerHTML=''; }

const RANKS=[

  {name:'Analista SOC',xp:320},{name:'Pentester',xp:520},{name:'Elite Hacker',xp:780}
];
function rankOf(xp){ let r=RANKS[0]; for(const k of RANKS) if(xp>=k.xp) r=k; return r; }
function nextRank(xp){ for(const k of RANKS) if(xp<k.xp) return k; return null; }

/* ---------- HELPERS ---------- */
const $=id=>document.getElementById(id);
const app=$('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function ownedCount(m){ return ['user','root','sys'].filter(k=>S.flags[m.id+'_'+k]).length; }
function isOwned(m){ return ownedCount(m)===3; }
function toast(msg){ const t=$('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),3400); }
function addXp(n){ S.xp+=n; save(); refreshHeader(); }
function refreshHeader(){
  const r=rankOf(S.xp), n=nextRank(S.xp);
  $('rankName').textContent=r.name; $('xpTxt').textContent=S.xp+' XP';
  const pct=n?Math.min(100,Math.round((S.xp-r.xp)/(n.xp-r.xp)*100)):100;
  $('xpBar').style.width=pct+'%';
}
function flagId(mid,k){ return mid+'_'+k; }
function submitFlag(mid,k){
  const m=MACHINES.find(x=>x.id===mid);
  const input=$('fl-'+mid+'-'+k);
  if(!input) return;
  /* validación tolerante: extrae el VULN{...} aunque el alumno pegue la línea completa
     del terminal (con flechas/emojis), espacios o comillas alrededor */
  let val=input.value.trim().replace(/^["'`]+|["'`]+$/g,'');
  const match=val.match(/VULN\{[^}]*\}/i);
  const sent=match?match[0]:val;
  const norm=s=>s.replace(/\s+/g,'').toLowerCase();
  if(sent===m.flags[k] || norm(sent)===norm(m.flags[k])){
    if(S.flags[flagId(mid,k)]){ toast('Ya tenías esta flag registrada ✔'); return; }
    S.flags[flagId(mid,k)]=true;
    addXp(m.xp[k]); save();
    toast('🎉 ¡Flag correcta! <b>+'+m.xp[k]+' XP</b> — '+m.name+' · '+k.toUpperCase());
    renderFlags(m);
  } else toast('❌ Flag incorrecta. Copia solo el texto <b>VULN{...}</b> tal y como aparece en el terminal.');
}
function hint(mid,k){
  const map={
    user:'La flag de usuario se consigue con el primer acceso/explotación. Revisa el output de nmap y los comandos sugeridos.',
    root:'Con acceso inicial, busca escalada o control total: cracking, SUID, credenciales filtradas… según la máquina.',
    sys:'La flag de sistema está en banners, versiones o config expuesta (banner grabbing).'
  };
  toast('💡 '+map[k]);
}

let currentView='machines', currentMachine=null, filter='all', toolFilter='all';

function view(v){
  currentView=v;
  ['machines','tools','solutions','ranking','profile','help'].forEach(k=>$('nav-'+k).classList.toggle('active',k===v));
  if(v==='machines') renderMachines();
  else if(v==='tools') renderTools();
  else if(v==='solutions') renderSolutions();
  else if(v==='ranking') renderRanking();
  else if(v==='profile') renderProfile();
  else renderHelp();
  window.scrollTo(0,0);
}

function renderMachines(){
  const list=MACHINES.filter(m=>(filter==='all'||m.mod===filter)&&(toolFilter==='all'||m.tools.includes(toolFilter)));
  app.innerHTML=
   '<h2 style="font-size:22px">Máquinas activas</h2>'
   +'<p style="color:var(--muted);font-size:13px;margin:6px 0 18px">'+MACHINES.length+' máquinas · cada una centrada en herramientas reales (nmap, Metasploit, Wireshark, Suricata, Wazuh, John the Ripper…). Cada flag suma XP. Progreso guardado en tu navegador.</p>'
   +'<div class="filters">'+['all','M01','M02','M03','M04','M05','M06','M07','M10'].map(f=>
      '<button class="'+(filter===f?'on':'')+'" onclick="filter=\''+f+'\';toolFilter=\'all\';renderMachines()">'+(f==='all'?'Todas':f)+'</button>').join('')+'</div>'
   +'<div class="filters" style="margin-top:-8px"><span style="font-size:11px;color:var(--muted);align-self:center">Herramienta:</span>'
   +['all'].concat(TOOLS).map(t=>
      '<button class="'+(toolFilter===t?'on':'')+'" onclick="toolFilter=\''+t+'\';renderMachines()">'+(t==='all'?'Todas':'🛠 '+t)+'</button>').join('')+'</div>'
   +'<div class="grid">'+list.map(m=>{
      const owned=ownedCount(m);

function renderSolutions(){
  let h='<h2 style="font-size:22px">📖 Manual de soluciones — instructor</h2>'
   +'<p style="color:var(--muted);font-size:13px;margin:6px 0 20px">Resolución paso a paso de las '+MACHINES.length+' máquinas: comandos en orden, qué revela cada uno y las 3 flags. Se recomienda repartir las máquinas según los módulos del curso (M01→M10).</p>';
  MODULE_ORDER=['M01','M02','M03','M04','M05','M06','M07','M08','M10'];
  MODULE_ORDER.forEach(mod=>{
    const ms=MACHINES.filter(m=>m.mod===mod);
    if(!ms.length) return;
    h+='<div style="margin:26px 0 12px"><span class="modtag" style="font-size:13px;padding:6px 14px">'+mod+'</span></div>';
    ms.forEach(m=>{
      h+='<div class="writeup" style="margin-bottom:16px">'
       +'<h3>'+esc(m.name)+' <span class="diff d-'+m.diff+'">'+m.diff.toUpperCase()+'</span> <span style="color:var(--muted);font-size:11px">'+esc(m.ip)+' · '+m.os+' · '+m.tools.join(', ')+'</span></h3>'
       +'<p style="margin-bottom:12px">'+esc(m.tag)+'</p>'
       +'<b style="color:var(--text)">Paso a paso:</b>'
       +'<ol style="margin:10px 0 14px 20px;line-height:2">';
      Object.keys(m.cmds).forEach((k,i)=>{
        const outs=m.cmds[k];
        /* describir qué consigue el comando según sus líneas flag/clave */
        let resumen=[];
        outs.forEach(l=>{
          if(l.startsWith('flagU:')) resumen.push('🚩 <b>flag user</b>');
          else if(l.startsWith('flagR:')) resumen.push('🚩 <b>flag root</b>');
          else if(l.startsWith('flagS:')) resumen.push('⚠ <b>flag system</b>');
        });
        /* primera línea informativa como contexto */
        const ctx=outs.find(l=>l.startsWith('info:'))||outs.find(l=>l.startsWith('err:'))||'';
        h+='<li><code>'+esc(k)+'</code>'+(resumen.length?' → '+resumen.join(' + '):'')
          +(ctx&&!resumen.length?'<br><span style="color:var(--muted);font-size:12px">'+esc(ctx.replace(/^(info:|err:|dim:|ok:)/,''))+'</span>':'')+'</li>';
      });
      h+='</ol>'
       +'<b style="color:var(--text)">Flags:</b><table style="margin-top:8px"><tr><th>Tipo</th><th>Valor</th><th>XP</th></tr>'
       +['user','root','sys'].map(k=>'<tr><td>'+k.toUpperCase()+'</td><td><code style="color:var(--yellow)">'+m.flags[k]+'</code></td><td>+'+m.xp[k]+' XP</td></tr>').join('')
       +'</table>'
       +'<div style="margin-top:12px"><b style="color:var(--orange)">Lección:</b> '+m.writeup[m.writeup.length-1]+'</div>'
       +'<div style="margin-top:10px"><button class="btn ghost" onclick="openMachine(\''+m.id+'\')">▶ Abrir la máquina</button></div>'
       +'</div>';
    });
  });
  app.innerHTML=h;
}

   +'<div class="term-wrap"><div class="term-bar"><span class="tdot" style="background:#ff5f57"></span><span class="tdot" style="background:#febc2e"></span><span class="tdot" style="background:#28c840"></span>'

  renderFlags(m);
  $('termInput').focus();
}

function tprint(html){
  const out=$('termout'); if(!out) return;
  const d=document.createElement('div'); d.innerHTML=html; out.appendChild(d);
  out.scrollTop=out.scrollHeight;
}
function tline(txt,cls){ tprint('<span class="'+(cls||'')+'">'+esc(txt)+'</span>'); }

/* ---------- INTERPRETE DE SHELL (estilo HTB) ----------
   No revela los comandos válidos: el alumno debe conocer la sintaxis real.
   - Valida objetivo: nmap/telnet/ssh/etc. exigen la IP correcta del objetivo.
   - Las pistas 💡 de cada output NO se muestran: se guardan y solo se
     revelan con el comando "hint".
   - Shell virtual: al conseguir acceso el prompt cambia al host remoto;
     las flags user/root se obtienen con cat user.txt / cat root.txt.
--------------------------------------------------------- */
let pendingHints=[];
let shell=null; /* {machine, user} cuando hay sesión abierta en el objetivo */
const CONNECT_VERBS=['telnet','ftp','ssh','nc','curl','vncviewer','redis-cli','mongodump','mysql','rdesktop'];
const ACCESS_WORDS=['connected','welcome','accepted','shell','meterpreter','pong','logged','session 1 opened','ejecutado','shell como','exploit success','access granted'];
function accessGained(lines){
  return lines.some(l=>{
    if(!l.startsWith('ok:')) return false;
    const t=l.slice(3).toLowerCase();
    return ACCESS_WORDS.some(w=>t.includes(w));
  });
}
function hostUser(m){ return m.os==='Windows'||m.os.includes('Windows')||m.os==='Windows AD' ? 'Administrator' : (m.os==='Web'||m.os==='API REST'||m.os==='WordPress'||m.os==='Jenkins'||m.os==='Docker/K8s'||m.os==='Email'||m.os==='Zero Trust') ? 'www-data' : 'root'; }
function shellPrompt(m){ return shell? esc(shell.user+"@"+m.name.toLowerCase())+":~#" : "┌──(kali㉿vulnlab)-[~]<br>└─$"; }
let pendingFlags={user:null,root:null}, lastMachine=null;
function refreshPrompt(){ document.querySelectorAll(".prompt").forEach(el=>el.innerHTML=shellPrompt(MACHINES.find(x=>x.id===currentMachine))); }
function iptokens(s){ return s.split(/\s+/).filter(t=>/^\d{1,3}(\.\d{1,3}){3}$/.test(t.replace(/[:,)]+$/,'')) ); }
const GENERIC_CMDS={
  'whoami':['kali'],'id':['uid=1000(kali) gid=1000(kali) grupos=1000(kali)'],
  'pwd':['/home/kali'],'uname':['Linux kali 6.6.9-amd64 #1 SMP Kali x86_64 GNU/Linux'],
  'ls':['Desktop  Documents  Downloads  tools  wordlists'],
  'ls -la':['total 48\ndrwxr-xr-x 12 kali kali 4096 oct 20 10:02 .\ndrwxr-xr-x  3 root root 4096 sep  1 09:14 ..\n-rw-r--r--  1 kali kali  220 sep  1 09:14 .bashrc'],
  'ip a':['1: lo: <LOOPBACK,UP> inet 127.0.0.1/8\n2: eth0: <BROADCAST,MULTICAST,UP> inet 10.10.14.15/24'],
  'sudo':['usage: sudo -h | -K | -k | -l | -V | -v ...  (falta el comando)'],
  'history':['nmap  telnet  ssh  hydra  john  burp  wireshark  … (usa ↑↓ del shell real: aquí no hay histórico)']
};

function runCmd(raw){
  const m=MACHINES.find(x=>x.id===currentMachine);
  if(currentMachine!==lastMachine){ shell=null; pendingFlags={user:null,root:null}; lastMachine=currentMachine; }
  const cmd=raw.trim();
  $('termInput').value='';
  tprint('<span class="cmd">'+shellPrompt(m)+'</span> '+esc(cmd));
  if(!cmd) return;
  const c=cmd;

  if(c==='clear'){ $('termout').innerHTML=''; pendingHints=[]; return; }
  if(c==='exit'){ shell=null; refreshPrompt(); view('machines'); return; }
  if(c==='help'){
    tline('Shell integrado de Kali. Comandos locales: help Â· hint Â· clear Â· exit','dim');
    tline('El resto es Linux estÃ¡ndar: nmap, telnet, ftp, ssh, nc, curl, hydra, john, hashcat, wireshark, cat, ls, grepâ¦','dim');
    tline('Esta consola responde a los comandos RELEVANTES para el objetivo '+esc(m.ip)+'. La sintaxis importa: IP, puertos y argumentos.','dim');
    return;
  }
  if(c==='hint'){
    if(pendingHints.length){ pendingHints.forEach(h=>tline('ð¡ '+h,'info')); }
    else if(!isOwned(m)) tline('ð¡ Pista general: empieza por enumerar el objetivo ('+esc(m.ip)+') con la herramienta que viste en '+m.mod+'. Si consigues acceso, explora el directorio con ls.','info');
    else tline('Â¡MÃ¡quina completada! Revisa el writeup. ð','ok');
    return;
  }

  const parts=c.split(/\s+/);
  const verb=parts[0];
  const fileArg=(parts[1]||'').replace(/^\.?\//,'');

  /* flags como archivos del host, estilo HTB: cat user.txt / cat root.txt */
  if(verb==='cat'&&(fileArg==='user.txt'||fileArg==='root.txt')){
    const kind=fileArg==='user.txt'?'user':'root';
    if(pendingFlags[kind]) tline(pendingFlags[kind],'flag');
    else tline('cat: '+fileArg+': No such file or directory','err');
    return;
  }
  if((c==='ls'||c==='ls -la'||c==='dir')&&(shell||pendingFlags.user||pendingFlags.root)){
    const files=[];
    if(pendingFlags.user) files.push('user.txt');
    if(pendingFlags.root) files.push('root.txt');
    if(shell) files.push('.bash_history','backups','mail');
    tline(files.join('  '),'dim');
    return;
  }

  /* comandos locales genÃ©ricos de la mÃ¡quina de ataque */
  if(GENERIC_CMDS[c]){ GENERIC_CMDS[c].forEach(l=>tline(l,'dim')); return; }
  if(GENERIC_CMDS[verb]&&parts.length===1){ GENERIC_CMDS[verb].forEach(l=>tline(l,'dim')); return; }

  /* candidatos: comandos registrados de la mÃ¡quina con el mismo verbo */
  const cands=Object.keys(m.cmds).filter(k=>k.split(/\s+/)[0]===verb);
  if(!cands.length){
    /* ---------- ERRORES REALES de cada herramienta ---------- */
    if(verb==='nmap'){
      if(parts.length===1){
        tline('Nmap 7.94 ( https://nmap.org )','dim');
        tline('WARNING: No targets were specified, so 0 hosts scanned.','err');
        tline('Nmap done: 0 IP addresses (0 hosts up) scanned in 0.05 seconds','dim');
        tline('Try Nmap -h for a complete list of options','err');
      } else {
        tline('Starting Nmap 7.94 ( https://nmap.org )','dim');
        tline('Note: Host seems down. If it is really up, but blocking our ping probes, try -Pn','err');
        tline('Nmap done: 1 IP address (0 hosts up) scanned in 3.05 seconds','dim');
      }
      return;
    }
    if(verb==='telnet'){ tline('telnet: '+esc(parts[1]||'')+': Name or service not known','err'); return; }
    if(verb==='ssh'){ tline('ssh: Could not resolve hostname '+(parts[parts.length-1]||'').replace(/^[^@]*@/,'')+': Name or service not known','err'); return; }
    if(verb==='ftp'){ tline('ftp: '+esc(parts[1]||'')+': Name or service not known','err'); tline('ftp: connect: Connection refused','err'); return; }
    if(verb==='nc'){ tline('nc: connect '+(parts[parts.length-2]||'')+' port '+(parts[parts.length-1]||'')+' (tcp) failed: Connection refused','err'); return; }
    if(verb==='curl'){ tline('curl: (7) Failed to connect to '+(parts[1]||'')+' port 80: Connection refused','err'); return; }
    if(verb==='hydra'){ tline('[ERROR] Target '+(parts[parts.length-2]||'')+' or options not valid','err'); tline('Usage: hydra [[[-l LOGIN|-L FILE] [-p PASS|-P FILE]] | [-C FILE]] server service [OPT]','err'); return; }
    if(verb==='john'){ tline('John: no hash file found. Usage: john [options] [password file]','err'); return; }
    if(verb==='hashcat'){ tline('hashcat (v6.2.6) starting...','dim'); tline('hashcat (v6.2.6) failed to start: no valid hash file','err'); return; }
    if(verb==='cat'){ tline('cat: '+(parts[1]||'')+': No such file or directory','err'); return; }
    if(verb==='sudo'&&parts.length===1){ tline('usage: sudo -h | -K | -k | -l | -V | -v','dim'); tline('usage: sudo [-bEHlPSv] [-p prompt] [-u username|#uid] [VAR=VALUE] COMMAND [ARG...]','dim'); return; }
    tline('zsh: command not found: '+verb,'err');
    return;
  }

  /* elegir el candidato con mejor puntuaciÃ³n de tokens coincidentes */
  let key=null,best=-1;
  for(const k of cands){
    const extra=k.split(/\s+/).slice(1);
    let score=extra.filter(t=>c.includes(t)).length;
    if(extra.length===0) score=0.5;
    if(score>best){ best=score; key=k; }
  }

  /* IPs escritas por el alumno + IPs válidas de la máquina (comandos y pivoting) */
  const typedIPs=iptokens(c);
  const mIPs=iptokens(m.ip);
  const allowedIPs=[...new Set([m.ip,...mIPs,...Object.keys(m.cmds).flatMap(k=>iptokens(k))])];

  if(verb==='nmap'||CONNECT_VERBS.includes(verb)){
    if(verb==='nmap'&&!typedIPs.length){
      tline('Nmap 7.94 ( https://nmap.org )','dim');
      tline('WARNING: No targets were specified, so 0 hosts scanned.','err');
      tline('Nmap done: 0 IP addresses (0 hosts up) scanned in 0.05 seconds','dim');
      return;
    }
    if(typedIPs.length&&!allowedIPs.some(ip=>typedIPs.includes(ip))){
      if(verb==='nmap'){
        tline('Starting Nmap 7.94 ( https://nmap.org )','dim');
        tline('Note: Host seems down. If it is really up, but blocking our ping probes, try -Pn','err');
        tline('Nmap done: 1 IP address (0 hosts up) scanned in 3.05 seconds','dim');
      }
      else if(verb==='ssh'){ tline('ssh: connect to host '+typedIPs[0]+' port 22: Connection refused','err'); }
      else if(verb==='telnet'){ tline('Trying '+typedIPs[0]+'...','dim'); tline('telnet: Unable to connect to remote host: Connection refused','err'); }
      else if(verb==='ftp'){ tline('ftp: connect: Connection refused','err'); tline('ftp: Can\x27t connect to '+typedIPs[0]+': Connection refused','err'); }
      else if(verb==='nc'){ tline('nc: connect '+typedIPs[0]+' port 80 (tcp) failed: Connection refused','err'); }
      else if(verb==='curl'){ tline('curl: (7) Failed to connect to '+typedIPs[0]+' port 80: Connection refused','err'); }
      else tline(verb+': connect to host '+typedIPs[0]+': Connection refused','err');
      return;
    }
    if(CONNECT_VERBS.includes(verb)&&!typedIPs.length&&!c.includes(m.ip)&&iptokens(key).length>0){
      if(verb==='ssh'){ tline('ssh: Could not resolve hostname '+(parts[parts.length-1]||'').replace(/^[^@]*@/,'')+': Name or service not known','err'); }
      else if(verb==='telnet'){ tline('telnet: '+esc(parts[1]||'')+': Name or service not known','err'); }
      else { tline(verb+': missing host operand','err'); tline('Try \x27'+verb+' --help\x27 for more information.','dim'); }
      return;
    }
  }

  /* ejecutar: pistas ð¡ ocultas (hint), flags user/root ocultas en archivos */
  pendingHints=[];
  const outs=m.cmds[key];
  outs.forEach(l=>{
    if(l.startsWith('info:ð¡')){ pendingHints.push(l.slice(6).trim()); return; }
    const fm=l.match(/VULN\{[^}]+\}/);
    if(l.startsWith('flagU:')&&fm){ pendingFlags.user=fm[0]; return; }
    if(l.startsWith('flagR:')&&fm){ pendingFlags.root=fm[0]; return; }
    let cls='';
    if(l.startsWith('dim:')){ cls='dim'; l=l.slice(4); }
    else if(l.startsWith('info:')){ cls='info'; l=l.slice(5); }
    else if(l.startsWith('err:')){ cls='err'; l=l.slice(4); }
    else if(l.startsWith('ok:')){ cls='ok'; l=l.slice(3); }
    else if(l.startsWith('flagS:')){ cls='flag'; l=l.slice(6); }
    tline(l,cls);
  });
  if(accessGained(outs)&&!shell){
    shell={machine:m.id,user:hostUser(m)};
    tline(' ','dim');
    tline('[*] SesiÃ³n interactiva establecida: '+shell.user+'@'+m.name.toLowerCase()+' â explora con ls','dim');
    refreshPrompt();
  }
}

/* ---------- FLAGS UI ---------- */
function renderFlags(m){
  const labels={user:'User flag',root:'Root flag',sys:'System flag'};
  let h='<h3>Flags · '+esc(m.name)+' ('+m.mod+') · '+(m.xp.user+m.xp.root+m.xp.sys)+' XP</h3>';
  for(const k of ['user','root','sys']){
    const done=!!S.flags[flagId(m.id,k)];
    h+='<div class="flagrow"><span style="min-width:90px;font-size:12px;color:var(--muted)">'+labels[k]+' (+'+m.xp[k]+')</span>'
     +'<input id="fl-'+m.id+'-'+k+'" placeholder="VULN{...}" '+(done?'value="'+m.flags[k]+'" disabled':'')+'>'
     +(done?'<span class="flagstate st-ok">✔ Obtenida</span>'
           :'<button class="btn" onclick="submitFlag(\''+m.id+'\',\''+k+'\')">Enviar</button>'
           +'<button class="hintpill" onclick="hint(\''+m.id+'\',\''+k+'\')">💡 pista</button>')
     +'</div>';
  }
  if(isOwned(m)){
    h+='<div class="flagrow" style="margin-top:14px"><b style="color:var(--green)">🏅 Máquina completada — ¡buen trabajo!</b></div>'
     +'<button class="btn ghost" onclick="toggleWriteup()">Ver writeup</button><div id="writeup" class="writeup hidden" style="margin-top:14px"></div>';
  }
  $('flagbox').innerHTML=h;
  if(isOwned(m)){
    $('writeup').innerHTML='<h3>Writeup — '+esc(m.name)+' · '+m.mod+'</h3>'+m.writeup.map((s,i)=>'<div style="margin-bottom:8px"><b style="color:var(--muted)">'+(i+1)+'.</b> '+s+'</div>').join('');
  }
}
function toggleWriteup(){ const w=$('writeup'); if(w) w.classList.toggle('hidden'); }

/* ---------- CLOUD (Google Apps Script, opcional) ---------- */
const CLOUD_KEY='vulnlab_cloud_v1';
function loadCloud(){
  try{ const d=JSON.parse(localStorage.getItem(CLOUD_KEY)); if(d&&d.url) return d; }catch(e){}
  return { url:'', classId:'tic30' };
}
function saveCloud(c){ localStorage.setItem(CLOUD_KEY,JSON.stringify(c)); }
let CLOUD=loadCloud();

function cloudUrl(params){
  const u=new URL(CLOUD.url);
  Object.keys(params).forEach(k=>u.searchParams.set(k,params[k]));
  return u.toString();
}
async function syncUp(){
  if(!S.user){ toast('Primero pon tu nombre (avatar arriba).'); return; }
  if(!CLOUD.url){ openCloudModal(); return; }
  const payload={ action:'submit', classId:CLOUD.classId, name:S.user, xp:S.xp,
                  machines:MACHINES.filter(isOwned).map(m=>m.name).join(', ') };
  toast('⇆ Subiendo progreso a la clase…');
  try{
    const r=await fetch(CLOUD.url,{ method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload) });
    const t=await r.text();
    if(t.indexOf('OK')>=0) toast('✅ Progreso subido: <b>'+S.xp+' XP</b> · '+esc(S.user));
    else toast('⚠ Respuesta inesperada del endpoint: '+esc(t.slice(0,80)));
  }catch(e){ toast('❌ Error al conectar con el endpoint. Revisa la URL (y que esté desplegado como «Anyone»). Detalle: '+esc(e.message||e)); }
}
async function syncDown(){
  if(!CLOUD.url){ openCloudModal(); return; }
  const box=$('globalRank');
  if(box){ box.innerHTML='<span class="dim">Descargando ranking de la clase…</span>'; }
  try{
    const r=await fetch(cloudUrl({action:'leaderboard',classId:CLOUD.classId}));
    const data=JSON.parse(await r.text());
    if(!Array.isArray(data)) throw new Error('formato inesperado');
    if(box){
      if(!data.length){ box.innerHTML='<span class="dim">Aún nadie ha subido progreso en esta clase.</span>'; return; }
      box.innerHTML='<table><tr><th>#</th><th>Alumno</th><th>XP</th><th>Máquinas</th><th>Última sync</th></tr>'
       +data.map((e,i)=>'<tr class="'+(e.name===S.user?'me':'')+'"><td>'+(i+1)+'</td><td><b>'+esc(e.name)+'</b>'
        +(e.name===S.user?' <span style="color:var(--green);font-size:11px">(tú)</span>':'')+'</td><td>'+e.xp+' XP</td>'
        +'<td>'+esc(e.machines||'—')+'</td><td style="color:var(--muted)">'+esc(e.stamp||'')+'</td></tr>').join('')+'</table>';
    }
  }catch(e){
    if(box) box.innerHTML='<span class="err">❌ No se pudo descargar el ranking: '+esc(e.message||e)+'</span>';
  }
}
function openCloudModal(){
  $('modal').innerHTML='<div class="modal-bg"><div class="modal" style="text-align:left;width:min(560px,92vw)">'
   +'<h2 style="text-align:center">⚙️ Ranking global de la clase</h2>'
   +'<p style="text-align:center">Opcional: conecta la plataforma con un Google Apps Script para compartir el ranking entre todos los alumnos.</p>'
   +'<div class="flagrow"><span style="min-width:110px;font-size:12px;color:var(--muted)">Endpoint URL</span>'
   +'<input id="cloudUrlInput" style="flex:1;min-width:240px;background:#060b12;border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:monospace;font-size:12px" placeholder="https://script.google.com/macros/s/AKfy.../exec" value="'+esc(CLOUD.url)+'"></div>'
   +'<div class="flagrow"><span style="min-width:110px;font-size:12px;color:var(--muted)">ID de clase</span>'
   +'<input id="cloudClassInput" style="flex:1;min-width:180px;background:#060b12;border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:monospace;font-size:12px" value="'+esc(CLOUD.classId)+'"></div>'
   +'<div style="display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap">'
   +'<button class="btn" onclick="saveCloudCfg()">Guardar</button>'
   +'<button class="btn ghost" onclick="closeModal()">Cerrar</button></div>'
   +'<h3 style="margin-top:18px;color:var(--orange);font-size:13px;text-transform:uppercase;letter-spacing:1px">Código del Apps Script (para el profesor)</h3>'
   +'<p style="font-size:12px">1. Crea un Google Sheet → <b>Extensiones → Apps Script</b>. 2. Pega este código. '
   +'3. <b>Implementar → Nueva implementación → Aplicación web</b>, ejecutar como <b>Yo</b>, acceso <b>Cualquiera</b>. 4. Copia la URL /exec y pégala arriba.</p>'
   +'<pre id="gasCode" style="background:#060b12;border:1px solid var(--border);border-radius:8px;padding:12px;font-size:11px;overflow-x:auto;white-space:pre;max-height:220px;overflow-y:auto">'+esc(GAS_CODE)+'</pre>'
   +'<div style="text-align:center;margin-top:10px"><button class="btn ghost" onclick="copyGas()">📋 Copiar código</button></div>'
   +'</div></div>';
}
function saveCloudCfg(){
  CLOUD.url=$('cloudUrlInput').value.trim();
  CLOUD.classId=$('cloudClassInput').value.trim()||'tic30';
  saveCloud(CLOUD); closeModal();
  toast('✅ Configuración de clase guardada.');
  if(currentView==='ranking') renderRanking();
}
function copyGas(){
  const t=$('gasCode').textContent;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast('📋 Código copiado al portapapeles'));
  else toast('Selecciona y copia manualmente');
}
const GAS_CODE=[
'/** VulnLab — backend del ranking de clase (Google Apps Script) **/',
'function doGet(e) {',
'  var action = e.parameter.action || "";',
'  var classId = e.parameter.classId || "tic30";',
'  var sheet = SpreadsheetApp.getActiveSheet();',
'  if (action === "leaderboard") {',
'    var rows = sheet.getDataRange().getValues();',
'    var out = [];',
'    for (var i = 1; i < rows.length; i++) {',
'      if (rows[i][0] !== classId) continue;',
'      out.push({ name: rows[i][1], xp: rows[i][2], machines: rows[i][3], stamp: rows[i][4] });',
'    }',
'    out.sort(function(a,b){ return b.xp - a.xp; });',
'    return ContentService.createTextOutput(JSON.stringify(out)).setMimeType(ContentService.MimeType.JSON);',
'  }',
'  return ContentService.createTextOutput("OK");',
'}',
'',
'function doPost(e) {',
'  var d = JSON.parse(e.postData.contents);',
'  if (d.action !== "submit") return ContentService.createTextOutput("OK");',
'  var sheet = SpreadsheetApp.getActiveSheet();',
'  var rows = sheet.getDataRange().getValues();',
'  var now = new Date().toLocaleString("es-ES");',
'  for (var i = 1; i < rows.length; i++) {',
'    if (rows[i][0] === d.classId && rows[i][1] === d.name) {',
'      sheet.getRange(i+1, 3, 1, 3).setValues([[d.xp, d.machines, now]]);',
'      return ContentService.createTextOutput("OK updated");',
'    }',
'  }',
'  sheet.appendRow([d.classId, d.name, d.xp, d.machines, now]);',
'  return ContentService.createTextOutput("OK created");',
'}'
].join('\n');


function renderRanking(){
  const rows=[...fakeUsers];
  if(S.user) rows.push([S.user,rankOf(S.xp).name,S.xp,true]);
  rows.sort((a,b)=>b[2]-a[2]);
  app.innerHTML='<h2 style="font-size:22px">Ranking de la clase</h2>'
   +'<p style="color:var(--muted);font-size:13px;margin:6px 0 18px">Los demás alumnos son simulados. Tu fila aparece destacada.</p>'
   +'<div style="display:flex;gap:10px;margin:18px 0 8px;flex-wrap:wrap">'
   +'<button class="btn" onclick="syncUp()">⇆ Subir mi progreso</button>'
   +'<button class="btn ghost" onclick="syncDown()">🌐 Descargar ranking global</button>'
   +'<button class="btn ghost" onclick="openCloudModal()">⚙️ Configurar clase</button></div>'
   +'<h3 style="font-size:14px;color:var(--orange);margin-top:18px;text-transform:uppercase;letter-spacing:1px">Ranking global de la clase</h3>'
   +'<div class="flagbox" id="globalRank" style="margin-top:10px"><span class="dim" style="color:var(--muted);font-size:13px">'+(CLOUD.url?'Pulsa «Descargar ranking global» para actualizar.':'Sin configurar — pulsa ⚙️ Configurar clase para conectar el Google Apps Script del curso.')+'</span></div>'
   +'<h3 style="font-size:14px;color:var(--orange);margin-top:22px;text-transform:uppercase;letter-spacing:1px">Ranking local (simulado)</h3>'
   +'<table style="margin-top:10px"><tr><th>#</th><th>Alumno</th><th>Rango</th><th>XP</th><th>Máquinas</th></tr>'
   +rows.map((r,i)=>{
      const mine=r[3]===true;
      const pwned=mine? MACHINES.filter(isOwned).length : Math.min(MACHINES.length,Math.floor(r[2]/70));
      return '<tr class="'+(mine?'me':'')+'"><td>'+(i+1)+'</td><td><b>'+esc(r[0])+'</b>'+(mine?' <span style="color:var(--green);font-size:11px">(tú)</span>':'')+'</td>'
        +'<td><span class="rankname">'+esc(r[1])+'</span></td><td>'+r[2]+' XP</td><td>'+pwned+' / '+MACHINES.length+'</td></tr>';
    }).join('')+'</table>';
  if(CLOUD.url) syncDown();
}

/* ---------- PERFIL ---------- */
function renderProfile(){
  const r=rankOf(S.xp), n=nextRank(S.xp);
  const owned=MACHINES.filter(isOwned).length;
  const flagsTotal=Object.keys(S.flags).length;
  app.innerHTML='<h2 style="font-size:22px">Mi progreso</h2>'
   +'<div class="flagbox" style="margin-top:18px"><h3>'+esc(S.user||'Alumno sin identificar')+' · Rango: <span class="rankname">'+r.name+'</span> · '+S.xp+' XP</h3>'
   +'<div style="margin:10px 0 14px"><button class="btn ghost" onclick="askName(true)">✏️ Cambiar mi nombre</button></div>'
   +(n? '<p style="font-size:13px;color:var(--muted);margin-bottom:10px">Te faltan <b style="color:var(--text)">'+(n.xp-S.xp)+' XP</b> para <b>'+n.name+'</b>.</p>'
      : '<p style="font-size:13px;color:var(--green)">¡Rango máximo alcanzado! 🏆</p>')
   +'<table><tr><th>Métrica</th><th>Valor</th></tr>'
   +'<tr><td>Máquinas completadas</td><td>'+owned+' / '+MACHINES.length+'</td></tr>'
   +'<tr><td>Flags conseguidas</td><td>'+flagsTotal+' / '+(MACHINES.length*3)+'</td></tr>'
   +'<tr><td>Herramientas practicadas</td><td>'+TOOLS.filter(t=>MACHINES.filter(m=>m.tools.includes(t)).some(isOwned)).length+' / '+TOOLS.length+'</td></tr></table>'
   +'<div style="margin-top:16px"><button class="btn ghost" onclick="resetAll()">Borrar progreso</button></div></div>';
}
function resetAll(){ localStorage.removeItem(SAVE_KEY); S=load(); refreshHeader(); toast('Progreso reiniciado.'); view('machines'); }

/* ---------- GUÍA ---------- */
function renderHelp(){
  app.innerHTML='<h2 style="font-size:22px">Guía rápida</h2>'
  +'<div class="writeup" style="margin-top:18px"><h3>Cómo funciona</h3>'
  +'<p>Plataforma CTF 100% estática para GitHub Pages. Cada máquina simula un escenario real y su terminal interpreta los comandos de las herramientas asociadas: la salida contiene las flags. Progreso en <code>localStorage</code>.</p>'
  +'<h3 style="margin-top:14px">Herramientas que practicarás</h3>'
  +'<p><b>nmap</b> (recon) · <b>Hydra</b> (fuerza bruta) · <b>John the Ripper / Hashcat</b> (cracking) · <b>Metasploit</b> (explotación) · <b>searchsploit</b> (CVEs) · <b>Nikto / Gobuster / sqlmap</b> (web) · <b>Wireshark / tcpdump</b> (análisis de tráfico) · <b>Suricata + Wazuh</b> (detección/SIEM) · <b>Responder</b> (AD) · <b>netcat</b> (banner grabbing) · <b>AWS CLI / Docker</b> (cloud).</p>'
  +'<h3 style="margin-top:14px">Publicar en GitHub Pages</h3>'
  +'<p>Descarga este HTML como <code>index.html</code>, súbelo a la rama <code>main</code> de un repo y activa <b>Settings → Pages → Branch: main</b>. Quedará en <code>https://usuario.github.io/repo/</code>. Sin servidor ni base de datos.</p>'
  +'<h3 style="margin-top:14px">⚠️ Aviso legal</h3>'
  +'<p>Simulación con fines exclusivamente educativos. En el mundo real, prueba solo sistemas con <b>autorización escrita</b>. El acceso no autorizado es un delito (art. 197.3 CP / CFAA).</p></div>';
}

/* init */
refreshHeader();
if(S.user){ $('avatar').textContent=S.initials; }
else { setTimeout(askName,600); }
view('machines');
</script>
